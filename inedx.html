mark{color:var(--bad)}

dialog{width:min(460px,calc(100% - 36px));max-height:85vh;border:1px solid var(--line);border-radius:18px;padding:26px;color:var(--ink);box-shadow:0 10px 75px #173a2530}dialog::backdrop{background:rgba(15,36,26,.4)}dialog h2{font-size:1.45rem}dialog p{line-height:1.75;margin-top:12px}dialog .actions{justify-content:space-between}dialog a{font-weight:650;padding:8px 0}

<main class="wrap"><aside class="intro" aria-label="測驗進度"><h1>UDL 教學情境<span class="second">自我測驗</span></h1><p class="lead">從 10 個校園情境，辨認常見迷思，練習做出教學決定。</p><figure class="picture" aria-hidden="true"><img id="art" alt="" width="440" height="352"></figure><div class="prog"><div class="progmeta"><span>作答進度</span><b id="progressText">0 / 10</b></div><div class="bar" id="progress" role="progressbar" aria-label="已送出題數" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><i id="bar"></i></div></div></aside>
<section class="card" id="card" tabindex="-1" aria-label="測驗內容"><noscript>請在瀏覽器開啟 JavaScript，以使用互動測驗。</noscript></section></main>
<dialog id="guide" aria-labelledby="guideTitle"><h2 id="guideTitle">作答說明</h2><p>每次會看到一個教學情境。請從四個選項選出一項，再按「送出答案」。第 3 題和第 8 題請選出迷思。</p><p>送出後可查看所選選項的解析，再自行前往下一題。每題 1 分，共 10 分，沒有時間限制。完成後可逐題回顧，或重新測驗。</p><div class="actions"><a id="download" download="UDL_教學情境自我測驗.html" href="index.html">下載離線版</a><button class="primary" type="button" id="close">返回測驗</button></div></dialog>
<script>
'use strict';
const questions=[["明鄭時期的航線", "為全班預先設計", "五年級即將學習明鄭時期。教師發現上一屆有學生能念出港口名稱，卻看不懂史料描述的航線。今年班上沒有已鑑定的特教生。", "今年備課時，哪一項做法最符合 UDL？", ["先照原教材授課，等第一次測驗後，再為低分學生補教地名。", "課前備妥地圖與地名註解，讓全班依需要取用，再用史料解釋航線。", "依國語成績分組，高分組分析航線，低分組只需記住港口名稱。", "將航線做成動畫，要求全班看完後，以相同方式背誦港口順序。"], 1, ["教師已知道學生容易卡在空間關係，等到測驗之後才補教，會錯過在第一次閱讀時提供支持的機會。", "地圖補足港口的空間關係，註解協助讀懂地名。學生都可依需要取用，最後仍須用史料解釋航線。", "國語成績不足以判斷誰能推理航線，分組後也讓一部分學生失去練習歷史解釋的機會。", "動畫可能有幫助，但背誦地名順序無法顯示學生已理解港口位置與航線的關係。"]], ["比較兩種能源", "保留核心學習挑戰", "自然課的目標是「引用資料，比較兩種能源的優缺點」。幾位學生對資料中的專有詞彙不熟。", "哪項調整最能保留原來的學習目標？", ["將任務改成從圖片中認出兩種能源，並正確說出名稱。", "先提供教師寫好的比較結論，請學生從資料中抄錄對應句子。", "保留原資料，將評分重點改為學生是否完成閱讀及參與討論。", "提供詞彙表與比較架構，仍請學生引用資料、說明兩種能源的取捨。"], 3, ["辨認名稱只顯示學生知道這是什麼能源。原任務還要運用資料比較優缺點。", "比較結論已由教師決定。抄錄句子不足以看出學生如何衡量資料並做出判斷。", "完成閱讀和參與討論能反映投入情況，但兩者都不足以判斷學生是否會引用資料比較能源。", "詞彙表協助理解資料，比較架構協助整理想法。引用證據、衡量優缺點及說明取捨仍由學生完成。"]], ["水循環的圖與聲音", "多元表徵與學習風格", "自然領域教師共備「水循環」單元，提出以下四個看法。", "哪一項是對多元表徵的迷思？", ["可以先用圖解追蹤水的移動，再用口頭說明釐清「蒸發」的意義。", "學生遇到不熟悉的過程時，可以在文字、圖解與解說之間來回參照。", "先測出每位學生的感官學習類型，再固定分派對應教材，最能落實 UDL。", "選用圖解時，要確認學生看得懂箭頭方向，也理解箭頭代表的變化。"], 2, ["圖解呈現移動路徑，口頭解說補充概念，兩者各有用途。這是合理的表徵設計。", "來回對照有助於看見不同表示方式間的關係，也保留學生選用策略的空間。", "迷思在於把感官偏好當成固定類型，並據以限定教材。研究不足以支持普遍採用這種配對教法，學生也應有機會學習新策略。", "箭頭的方向和含義都需要理解；檢查學生如何解讀符號，是適切的教學做法。"]], ["小組搶答", "有實質影響的參與", "一名使用輔助溝通系統（AAC）的學生能提出預測，但在自然課搶答時，常在訊息組好前，組員就已送出答案。", "哪項改變最直接處理他遇到的障礙？", ["各組先保留個人準備時間，再輪流提出預測，最後共同決定答案。", "讓他固定擔任計分員，以便在維持搶答節奏的同時擁有小組角色。", "小組送出答案後，再請他個別向教師說明原先想提出的預測。", "把口頭題目同步顯示在螢幕上，保留原來的搶答及計分方式。"], 0, ["準備時間讓學生組好訊息，輪流分享讓他的預測能在小組決定前被聽見，並有機會影響結論。", "計分能讓他有工作可做，卻沒有處理他希望以科學預測參與共同決定的需求。", "個別說明有助教師了解他的想法，但小組決定已經完成，他的意見無法加入討論。", "螢幕能幫助接收題目，但原先的困難是在有限時間內組織與送出訊息。"]], ["校園用電調查", "有意義的選擇", "在「校園節電」探究中，教師希望落實 UDL 3.0 第 7.1 項「優化選擇與自主性」。", "哪項安排最能讓學生練習為自己的探究作決定？", ["教師分派探究問題與方法，學生自行選擇成果海報的顏色與字體。", "教師公布十種調查方法，由學生抽籤決定，以增加活動的多樣性。", "學生先提出想查的問題，再決定要看用電紀錄或實地觀察，並說明理由。", "學生先投票選出最喜歡的方法，全班再用得票最高的方法調查不同問題。"], 2, ["外觀可以是有意義的選擇，但在這個任務裡，選顏色與字體沒有讓學生判斷該怎麼調查。", "選項多不代表學生能為自己作決定；抽籤也沒有讓學生思考方法能取得哪種證據。", "學生先釐清想知道什麼，再選擇能回答問題的方法。例如，分時紀錄能反映何時用電較多，實地觀察則能找出無人卻亮燈的空間。", "投票能形成班級決議，但不同探究問題可能需要不同方法；這個安排限制了各組依問題作選擇。"]], ["節電提案的兩種評量", "表達方式與評量目標", "自然課要評量「用證據支持節電建議」，國語課要評量「寫出有主題句與支持句的段落」。一名學生希望使用口述。", "哪項安排最適切？", ["兩科都接受同一段錄音，因為內容相同就能證明兩科目標均已達成。", "自然課可用口述提出證據；國語課可先口述構思，再完成並修訂文字段落。", "兩科都要求親筆書寫，讓教師能用同一種作答形式比較學生表現。", "自然課收書面報告，國語課接受口述，因為國語課包含說話能力。"], 1, ["同一段錄音可以呈現科學主張與證據，卻沒有留下可供判斷書面段落組織的作品。", "自然課可從口述判斷推理。國語課保留學生完成的文字段落，也可使用打字或語音輸入來構思、撰寫和修訂。", "統一親筆書寫會為科學評量增加與推理無關的負擔。即使要評段落組織，也未必需要手寫。", "不同單元的目標不同。這次國語課要看的證據是書面段落，國語課也教說話並不足以改變本次評量目標。"]], ["眼控輸入與作答時間", "全班設計與個別合理調整", "教師已開放全班用口述或打字回答科學問題。一名使用眼控輸入的學生說：「我知道理由，但每次組完第一句，時間就到了。」", "教師下一步怎麼做最適切？", ["再示範一次兩種作答方式，請學生從現有選項中選擇速度較快的一種。", "請同儕依他的表情代為完成答案，讓小組能在原定時間內交件。", "將他的題目改成辨認科學名詞，使他能在原定時間內完成全部題目。", "與學生確認眼控作答受限的環節，討論並試行適切的時間或作答安排。"], 3, ["學生已指出時間限制，僅重複既有選項，無法確認他的實際需求能否獲得滿足。", "同儕依表情推測可能無法忠實傳達他的理由，也使教師難以確認答案是否來自學生本人。", "辨認名詞改變了要評量的科學推理能力，眼控作答時間的障礙仍在。", "全班的彈性和個別合理調整可以並行。從學生的經驗找出限制，再共同試行與檢視，能保留他展現科學推理的機會。"]], ["課發會如何檢視課程", "36 項設計考量的運用", "學校準備以 UDL 改善校訂課程，課程發展委員會提出下列做法。", "哪一項是對 UDL 指引的迷思？", ["以每節課勾選了多少項作為主要品質指標，勾選愈完整，代表教學愈有效。", "先從多班反覆遇到的參與障礙著手，再選擇與該問題相關的設計考量。", "邀請學生指出教材哪裡難以使用，將意見帶入下一次年級共備。", "對照課程目標與學生作品，檢視這次選用的做法是否有助於學習。"], 0, ["迷思在於把指引當成按數量計分的清單。勾選項目只顯示教案的記載，成效還需要從參與及學習證據判斷。", "從實際障礙出發，再選擇相關設計考量，符合指引依情境選用的原則。", "學生能指出教師備課時未察覺的障礙，把這些經驗帶入共備能協助調整課程。", "比較目標與作品能協助判斷，教學措施是否讓學生展現原先預期的學習。"]], ["節電提案的回饋", "學習者能動性", "學生的節電提案只寫了「應該少開冷氣」，尚未引用資料。", "哪項回饋最能幫助他學會監控並修正自己的策略？", ["「方向很好，我替你挑出一筆用電資料，你把它放進第二段。」", "「你的提案目前是七十分，可以參考高分同學的作品再交一次。」", "「你想證明哪個時段最需要改善？自己選一筆資料，檢查它能否支持建議，再決定怎麼改。」", "「你的理由還不夠完整，請把段落寫長一點，補充更多節電方法。」"], 2, ["教師已替學生挑出證據，學生可以完成修改，卻少了選擇與檢查證據的練習。", "分數及範例可供參考，但此回饋沒有點明這份作品應檢查主張與證據的關係。", "提示引導學生釐清主張、自己選擇資料、判斷適切性並決定如何改寫，保留了學生的判斷與行動。", "增加字數或建議數量，無法直接處理當前提案缺乏證據的問題。"]], ["用電圖解的效果", "參與及學習證據", "教師在用電資料表旁增加長條圖，希望讓原本難以起步的學生能開始作答，並學會引用數據解釋節電建議。", "哪一組資料最能檢視這兩個目的？", ["學生喜歡長條圖的比例，以及願意在下次繼續使用的人數。", "同類任務中學生能否獨立開始作答，以及作品能否正確引用數據支持建議。", "學生使用長條圖的時間，以及查閱各欄資料的次數。", "全班準時交件的比例，以及教師在教案中採用了幾項 UDL 指引。"], 1, ["喜好與使用意願能補充說明學生的經驗，卻無法判斷學生是否能獨立作答或解釋證據。", "能否獨立開始，反映參與障礙的變化；能否引用數據支持建議，則直接對應學習目標。", "觀看時間和查閱次數顯示操作情形，無法直接說明學生理解了什麼或能否獨立起 const letters='ABCD';
const N=questions.length;
const storageKey='udl-situations-zh-v1';
const initial=()=>({mode:'quiz',index:0,answers:[]});
function restore(){
 try {
  const s=JSON.parse(sessionStorage.getItem(storageKey));
  if(!s||!Array.isArray(s.answers)||s.answers.length>N||!s.answers.every(x=>Number.isInteger(x)&&x>=0&&x<4)||!Number.isInteger(s.index)||s.index<0||s.index>=N)return initial();
  if(s.mode==='quiz' && (s.answers.length===s.index||s.answers.length===s.index+1))return s;
  if((s.mode==='review'||s.mode==='done')&&s.answers.length===N)return s;
 }catch{}
 return initial();
}
let state=restore();
const byId=id=>document.getElementById(id);
const card=byId('card');
const html=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{sessionStorage.setItem(storageKey,JSON.stringify(state))}catch{}}
function progress(){
 const count=state.answers.length;
 byId('progressText').textContent=count+' / '+N;
 byId('progress').setAttribute('aria-valuenow',String(count));
 byId('bar').style.width=(count/N*100)+'%';
 const pic=state.mode==='done'?0:state.index===0?3:[3,6].includes(state.index)?2:0;
 byId('art').src=arts[pic];
}
function optionHtml(opts,i,picked,correct,locked){
 const right=locked&&i===correct;
 const wrong=locked&&i===picked&&!right;
 const tag=right?(i===picked?'你的答案・正解':'正確答案'):wrong?'你的答案':'';
 return '<label class="option'+(locked?' locked':'')+(right?' right':'')+(wrong?' wrong':'')+'"><input type="radio" name="choice" value="'+i+'"'+(i===picked?' checked':'')+(locked?' disabled':'')+'><span class="letter" aria-hidden="true">'+letters[i]+'</span><span class="opt-text"><span class="sr">選項 '+letters[i]+'，</span>'+html(opts[i])+'</span>'+(tag?'<span class="mark">'+tag+'</span>':'')+'</label>';
}
function feedback(q,picked){
 const correct=q[5],hit=picked===correct;
 return '<section id="feedback" class="feedback'+(hit?'':' miss')+'" aria-labelledby="feedbackTitle"><h3 id="feedbackTitle" tabindex="-1">'+(hit?'答對了！':'答錯了，正確答案是 '+letters[correct]+'。')+'</h3><p><strong>你選的 '+letters[picked]+'：</strong>'+html(q[6][picked])+'</p>'+(hit?'':'<p><strong>正解 '+letters[correct]+'：</strong>'+html(q[6][correct])+'</p>')+'<p class="concept">本題概念｜'+html(q[1])+'</p></section>';
}
function button(label,action,primary=true){
 return '<button type="button" class="'+(primary?'primary':'secondary')+'" data-action="'+action+'">'+label+'</button>';
}
function renderQuestion(){
 const ix=state.index,q=questions[ix],review=state.mode==='review';
 const picked=state.answers[ix],locked=picked!==undefined,mis=[2,7].includes(ix);
 const choices=q[4].map((_,i)=>optionHtml(q[4],i,picked,q[5],locked)).join('');
 let actions='';
 if(review){
  actions=button('回到成績','summary',false)+(ix>0?button('上一題','prev',false):'')+(ix<N-1?button('下一題','next'):'');
 }else if(locked){actions=button(ix===N-1?'查看測驗結果':'下一題',ix===N-1?'summary':'next');}
 else{actions='<button class="primary" type="submit">送出答案</button>';}
 card.innerHTML='<div class="meta"><span class="counter">'+(review?'回顧・':'')+'第 '+(ix+1)+' 題／共 '+N+' 題</span><span class="kind">'+(mis?'單選・辨識迷思':'情境單選題')+'</span></div><h2 tabindex="-1" id="viewtitle">'+html(q[0])+'</h2><p class="scenario" id="scenario">'+html(q[2])+'</p><form id="form" class="form"><fieldset aria-describedby="scenario"><legend>'+html(q[3])+'</legend><div class="opts">'+choices+'</div></fieldset><p id="error" class="error" role="alert" hidden>請先選擇一個答案，再送出。</p>'+(locked?feedback(q,picked):'')+'<div class="actions'+(review?' review-actions':'')+'">'+actions+'</div></form>';
}
function renderSummary(){
 const hits=state.answers.map((a,i)=>a===questions[i][5]);
 const score=hits.filter(Boolean).length;
 const rows=questions.map((q,i)=>'<button type="button" data-review="'+i+'" aria-label="回顧第 '+(i+1)+' 題，'+html(q[0])+'，'+(hits[i]?'答對':'答錯')+'"><span class="rnum">'+String(i+1).padStart(2,'0')+'</span><span class="rtopic">'+html(q[0])+'</span><span class="rstate'+(hits[i]?'':' miss')+'">'+(hits[i]?'答對':'答錯')+'</span></button>').join('');
 card.innerHTML='<div class="meta"><span class="counter">已完成 '+N+' 題</span></div><h2 tabindex="-1" id="viewtitle">測驗結果</h2><div class="resultstat"><b>'+score+' / '+N+'</b><span>題答對</span></div><p class="scenario">選取下方任一題，可回顧你的作答與解析。</p><div class="resultlist">'+rows+'</div><div class="actions end-actions">'+(score<N?button('回顧第一題錯題','firstmiss'):'')+button('重新測驗','restart',false)+'</div>';
}
function render(focusId){
 progress();
 if(state.mode==='done')renderSummary();else renderQuestion();
 if(focusId){const el=byId(focusId);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest'});}}
}
card.addEventListener('change',e=>{if(e.target.name==='choice'){byId('error').hidden=true;}});
card.addEventListener('submit',e=>{
 e.preventDefault();
 if(state.mode!=='quiz'||state.answers.length!==state.index)return;
 const chosen=card.querySelector('input[name="choice"]:checked');
 if(!chosen){byId('error').hidden=false;card.querySelector('input[name="choice"]').focus();return;}
 state.answers.push(Number(chosen.value));save();render('feedbackTitle');
});
card.addEventListener('click',e=>{
 const node=e.target.closest('button');if(!node)return;
 const target=node.dataset.action;
 if(node.dataset.review!==undefined&&state.mode==='done'){state.mode='review';state.index=Number(node.dataset.review);}
 else if(target==='firstmiss'&&state.mode==='done'){const i=state.answers.findIndex((v,j)=>v!==questions[j][5]);if(i<0)return;state.mode='review';state.index=i;}
 else if(target==='restart'&&state.mode==='done'){state=initial();}
 else if(target==='summary'&&state.answers.length===N){state.mode='done';}
 else if(target==='next'&&state.index<N-1&&(state.mode==='review'||state.answers.length===state.index+1)){state.index++;}
 else if(target==='prev'&&state.mode==='review'&&state.index>0){state.index--;}
 else return;
 save();render('viewtitle');
});
const guide=byId('guide');
byId('help').addEventListener('click',()=>guide.showModal());
byId('close').addEventListener('click',()=>guide.close());
byId('download').href=location.href.split('#')[0];
render();
</script>
</body>
</html>
